# Локальный запуск сервиса и базы.
#
#   docker compose up --build
#
# Значения по умолчанию предназначены только для разработки.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokens
      POSTGRES_PASSWORD: tokens
      POSTGRES_DB: tokens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokens -d tokens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-tokens-service:
    build:
      context: .
      # Контракт кладётся рядом с репозиторием; при сборке без него
      # подтягивается опубликованная версия.
      args:
        CONTRACT_PATH: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgres://tokens:tokens@db:5432/tokens?sslmode=disable
      HOST: 0.0.0.0
      PORT: 50052
      MAX_TOKENS_PER_USER: "10"
    env_file:
      - path: .env
        required: false

volumes:
  pgdata: